name: 🔄 Sync All Forks

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑：只读预览，只列出哪些仓库会被同步或转为拉取请求，不做任何改动"
        type: boolean
        default: false
      force_sync:
        description: "强制同步（旧模式）：直接调用 merge-upstream，不建 PR，GitHub 可能自动合并分叉仓库；不勾选则走 PR 模式"
        type: boolean
        default: false
      exclude_repos:
        description: "排除仓库：本次要跳过的仓库名，逗号分隔（例如 YimMenuV2,Cemu）"
        type: string
        default: ""
      only_repos:
        description: "仅限仓库：只处理这些仓库，逗号分隔（仓库名或 owner/仓库名；留空 = 全部 fork）"
        type: string
        default: ""
      exclude_private:
        description: "排除私有 fork：填 true 排除、false 处理；留空 = 跟随仓库变量 EXCLUDE_PRIVATE"
        type: string
        default: ""

  repository_dispatch:
    types: [sync-forks]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-forks:
    name: Sync All Forks to Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fork-manager
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run fork sync
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN_ORG: ${{ secrets.PAT_TOKEN_ORG }}
          OWNER_TOKENS: ${{ vars.OWNER_TOKENS || '{"JoyHub2990":"PAT_TOKEN_ORG"}' }}
          GH_USERNAME: ${{ github.actor }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
          EXCLUDE_REPOS: ${{ inputs.exclude_repos }}
          ONLY_REPOS: ${{ inputs.only_repos }}
          PERMANENT_EXCLUDES: ""
          SYNC_ALL_BRANCHES: ${{ vars.SYNC_ALL_BRANCHES || 'true' }}
          EXCLUDE_PRIVATE: ${{ inputs.exclude_private || vars.EXCLUDE_PRIVATE || 'true' }}
        run: |
          if [ -n "$PERMANENT_EXCLUDES" ] && [ -n "$EXCLUDE_REPOS" ]; then
            export EXCLUDE_REPOS="$PERMANENT_EXCLUDES,$EXCLUDE_REPOS"
          elif [ -n "$PERMANENT_EXCLUDES" ]; then
            export EXCLUDE_REPOS="$PERMANENT_EXCLUDES"
          fi
          node sync.js
